name: CI Quality Gate & Docker Hub Publish

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Static Type Checking & Production Build Validation
  lint-and-typecheck:
    name: TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend (Vite + TypeScript)
        working-directory: ./frontend
        run: npm run build

  # 2. Frontend Test Suite (Vitest)
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test

  # 3. Backend Unit & E2E Tests (with live Postgres 17 & Redis 7)
  test-backend:
    name: Test Backend & E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: jobs_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/jobs_db_test?schema=public"
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: 6379
      PORT: 3001
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Deploy Prisma Migrations to Test DB
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Run Backend Unit & Integration Tests (Jest)
        working-directory: ./backend
        run: npm test

      - name: Run Fastify E2E Tests
        working-directory: ./backend
        run: npm run test:e2e

  # 4. Backward Compatibility & Migration Integrity Check
  backward-compatibility:
    name: Backward Compatibility & Migration Safety
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: jobs_db_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/jobs_db_compat?schema=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Deploy Migrations to Clean Test Database
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Verify Migration History Integrity
        working-directory: ./backend
        run: |
          echo "Checking for unapplied or missing migrations..."
          npx prisma migrate status

      - name: Verify Zero Schema Drift (schema.prisma vs live database)
        working-directory: ./backend
        run: |
          echo "Verifying schema.prisma matches live migrated database..."
          npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

  # 5. Unified CI Quality Gate
  ci-gate:
    name: CI Quality Gate
    needs:
      - lint-and-typecheck
      - test-frontend
      - test-backend
      - backward-compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Assert All Required Checks Passed
        run: echo "✅ All CI quality gates and backward-compatibility checks passed successfully!"

  # 6. Publish Backend Image to Docker Hub
  publish-backend:
    name: Build & Push Backend Image
    needs: ci-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobs-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobs-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # 7. Publish Frontend Image to Docker Hub (runs in parallel with backend)
  publish-frontend:
    name: Build & Push Frontend Image
    needs: ci-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobs-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobs-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # 8. Update GitOps Manifest after both images are published
  update-gitops:
    name: Update GitOps Kubernetes Manifest
    needs: [publish-backend, publish-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Kubernetes Manifest Tag & Push to GitOps
        run: |
          sed -i "s|image: .*/jobs-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/jobs-backend:${{ github.sha }}|g" k8s/jobs.yaml
          sed -i "s|image: .*/jobs-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/jobs-frontend:${{ github.sha }}|g" k8s/jobs.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/jobs.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update jobs images tag to ${{ github.sha }} [skip ci]" && git push origin HEAD)
