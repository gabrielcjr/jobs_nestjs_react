services:
  # 1. PostgreSQL Database with GIN index support
  postgres:
    image: postgres:17-alpine
    container_name: jobs_ats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobs_db
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - jobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobs_network

  # 2. Redis 7 In-Memory Cache & Distributed Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: jobs_ats_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jobs_network

  # 3. NestJS Fastify Backend & Multi-ATS Ingestion Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobs_ats_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/jobs_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      PORT: 3001
      HOST: "0.0.0.0"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobs_network

  # 4. React 19 Frontend Web UI (Nginx reverse proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobs_ats_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - jobs_network

volumes:
  jobs_postgres_data:

networks:
  jobs_network:
    driver: bridge

