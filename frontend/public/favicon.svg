<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Terminal Prompt Icon >_ -->
  <path d="M 20 22 L 32 32 L 20 42" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="36" y1="42" x2="46" y2="42" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" />
</svg>
