<!doctype html>
<html lang="en" class="dark" data-theme="electric-cyan">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevATS — Multi-ATS Software Engineering Job Board</title>
    <meta name="description" content="Production-grade developer job board aggregating live postings across Greenhouse, Lever, and Ashby with auto-extracted tech stacks and deep filters." />
    <!-- Prevent flash of unstyled content (FOUC) by eagerly applying theme -->
    <script>
      (function() {
        try {
          var validPalettes = ["cyber-indigo", "emerald-jade", "electric-cyan", "solar-amber", "neon-rose"];
          var stored = localStorage.getItem("devats_active_palette");
          if (stored && validPalettes.indexOf(stored) !== -1) {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Font: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
